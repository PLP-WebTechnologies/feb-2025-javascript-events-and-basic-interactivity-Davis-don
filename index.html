<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Interactive Playground</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>🚀 JavaScript Interactive Playground</h1>
    </header>

    <main>
        <button id="magicBtn">Click Me!</button>
        <div id="imageGallery">
            <img src="https://images.unsplash.com/photo-1745953707460-959b97dfa42d?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Random Image">
            <img src="https://images.unsplash.com/photo-1745910020846-3d4d0088d24d?q=80&w=1937&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Random Image">
            <img src="https://images.unsplash.com/photo-1726064855836-6042eb0bc5da?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDF8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Random Image">
        </div>

        <div class="tabs">
            <button class="tab-btn" data-tab="1">Tab 1</button>
            <button class="tab-btn" data-tab="2">Tab 2</button>
            <button class="tab-btn" data-tab="3">Tab 3</button>
        </div>
        <div class="tab-content" id="tab-1">Content for Tab 1</div>
        <div class="tab-content" id="tab-2">Content for Tab 2</div>
        <div class="tab-content" id="tab-3">Content for Tab 3</div>
        
        <form id="signupForm">
            <input type="email" id="email" placeholder="Enter your email">
            <input type="password" id="password" placeholder="Enter password">
            <button type="submit">Submit</button>
            <p id="feedback"></p>
        </form>
    </main>

    <script src="script.js"></script>
</body>
</html>
